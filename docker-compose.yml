services:
  db:
    image: postgres:15
    container_name: todo_db_container
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "effective_cache_size=768MB"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: todo_db
    ports:
      - "5434:5432"
  adminer:
    image: adminer
    container_name: todo_adminer_container
    ports:
      - "8081:8080"